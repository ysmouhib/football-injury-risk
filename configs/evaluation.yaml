# Promotion-rule settings (the evaluation protocol section 3 and 3a).
primary_metric: pr_auc
decision_labels: [y7, y28]
main_origin: 2023
# "main" (main origin only) or "mean_origins" (mean of per-origin values).
# Set by the pre-specified power rule (PLAN.md open decision 11) after the
# baseline's bootstrap; challengers cannot be judged while this is null.
aggregation: main  # decided by the pre-specified power rule on the exp-0001 baseline
n_resamples: 1000
ci_level: 0.95
max_slope_regression: 0.05
# Owner amendment 2026-10-21 (forward only): from this experiment on, condition 3 fails only if
# delta_cal = |b_champion - 1| - |b_challenger - 1| < -0.05 and its paired player-cluster
# bootstrap 95% CI lies entirely below -0.05. Earlier experiments keep the point-estimate rule.
calibration_rule_v2_from: exp-0013
