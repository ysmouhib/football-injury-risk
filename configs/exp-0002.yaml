id: exp-0002
title: Class-weighted LightGBM, v0 features
stage: 1
hypothesis: >-
  A class-weighted gradient-boosted tree ensemble on the same v0 features
  improves validation PR-AUC over the logistic champion at both horizons by
  capturing non-linear age and exposure effects and their interactions.
champion: exp-0001
data_config: configs/data.yaml
features: v0
labels: [y7, y28]
seed: 20261020
# One controlled change vs exp-0001: the model block. Hyperparameters are fixed
# defaults declared before the run, not tuned.
model:
  kind: lightgbm
  params:
    objective: binary
    class_weight: balanced
    n_estimators: 400
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 200
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 1.0
    n_jobs: 4
