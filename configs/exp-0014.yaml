id: exp-0014
title: XGBoost-AFT, v0+history (survival challenger)
stage: 3
arm: survival
hypothesis: >-
  An XGBoost accelerated-failure-time model on the same features improves the
  validation time-dependent C-index over the Random Survival Forest champion.
champion: exp-0013
data_config: configs/data.yaml
features: v0+history
outcome: surv90
seed: 20261020
# One controlled change vs exp-0013: the model block. Settings pre-registered in
# PLAN amendment A9 and committed before exp-0013 was evaluated.
model:
  kind: xgb_aft
  params:
    n_estimators: 400
    learning_rate: 0.03
    max_depth: 6
    min_child_weight: 50
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0
    aft_loss_distribution: normal
    aft_loss_distribution_scale: 1.0
    tree_method: hist
    nthread: 4
