id: exp-0024
title: Operational characteristics (alarm burden) of the frozen champion, in-season holdout
stage: 7
analysis: operational
question: >-
  At operating thresholds fixed in advance on the calibration split (precision about 1.5x, 2x and
  3x the in-season prevalence), how many alarms does the frozen champion raise per week on the
  in-season holdout, how precise are they, and how many injuries do they catch or miss, how early?
# Frozen champion (PLAN decision 19); analysis only, no model-selection decision.
champion: exp-0018
data_config: configs/data.yaml
population: in_season
labels: [y7, y28]
precision_multiples: [1.5, 2.0, 3.0]
# Selected from calibration half B (2023/24, in-season) only, by the rule in PLAN decision 21, and
# committed before any holdout row is read (the analysis refuses to run otherwise).
# Calibration rows (half B, in-season): y7 29,675 rows, 604 injuries, prevalence 0.02035;
# y28 29,495 rows, 2,276 injuries, prevalence 0.07717. Every target precision was reached.
thresholds:
  y7: [0.017832817799829745, 0.026759884696369758, 0.05130178593492917]
  y28: [0.06707590057850887, 0.10137594666242843, 0.18013623416443242]
seed: 20261020
n_resamples: 1000
